[project]
site_name = "BeeTea"
site_description = "Reactive behavior trees for Python, with optional ROS 2 transport"
site_author = "Kaj Munhoz Arfvidsson"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guide" = [
    { "Core concepts" = "guide/concepts.md" },
    { "Nodes" = "guide/nodes.md" },
    { "Running trees" = "guide/running.md" },
    { "Text format" = "guide/text-format.md" },
    { "Observing trees" = "guide/observing.md" },
    { "Replacing subtrees" = "guide/replacing.md" },
    { "ROS 2 integration" = "guide/ros.md" },
  ] },
  { "API reference" = [
    { "beetea.bt" = "reference/bt.md" },
    { "beetea.ros" = "reference/ros.md" },
  ] },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "amber"
accent = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "amber"
accent = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
show_root_heading = true
show_source = false
show_signature_annotations = true
separate_signature = true
merge_init_into_class = true
filters = ["!^_"]
